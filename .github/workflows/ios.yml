name: ios

on:
  push:
    paths-ignore:
      - 'experiments/tinygrad_metal/**'
      - 'experiments/aneforge/**'
      - 'experiments/big_model/**'
      - '.github/workflows/aneforge.yml'
      - '.github/workflows/tinygrad-metal.yml'
      - '.github/workflows/ane-probe.yml'
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  # The full core test suite (core/run_tests.sh) needs the original ONNX model, which is too large to commit,
  # so CI only checks that the C core builds cleanly. Run the full suite locally.
  core-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile the C core with warnings as errors
        run: |
          cc -std=c99 -O2 -Wall -Wextra -Werror -c core/opcore.c -o /tmp/opcore_gcc.o
          clang -std=c99 -O2 -Wall -Wextra -Werror -c core/opcore.c -o /tmp/opcore_clang.o

  coreml-verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: python -m pip install coremltools numpy
      - name: Verify Core ML package against the reference
        run: |
          mkdir -p verify-out
          for units in CPU_ONLY ALL; do
            echo "=== $units ===" | tee -a verify-out/verify.txt
            python scripts/verify_coreml_mac.py coreml/driving_supercombo.mlpackage \
              reference/driving_reference_fp32.npz "$units" 2>&1 | tee -a verify-out/verify.txt
          done
      # Diagnostic: the app's own model-runner and self-test code, built as a plain macOS command-line tool.
      # Same Swift, same Xcode-style compiled model, but no simulator: separates app bugs from simulator numerics.
      - name: Run the app's self-test code natively on macOS
        continue-on-error: true
        run: |
          mkdir -p macrun && cd macrun
          xcrun coremlcompiler compile ../coreml/driving_supercombo.mlpackage .
          cp ../fixtures/*.bin .
          printf 'import Foundation\nimport CoreML\nlet r = SelfTest.run(units: .cpuOnly)\nexit(r.passed ? 0 : 1)\n' > main.swift
          swiftc -O ../ios/OpenpilotPhone/ModelRunner.swift ../ios/OpenpilotPhone/SelfTest.swift main.swift -o selftest_mac
          ls -la
          ./selftest_mac 2>/dev/null | tee ../verify-out/selftest_mac.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coreml-verify
          path: verify-out/

  ios-sim:
    runs-on: macos-15
    timeout-minutes: 60
    # Known open issue: on the iOS 26 runtime Core ML produces systematically different numbers for this model
    # (self-test fails there; it passes on iOS 18 and natively on macOS 15). The iOS 26 job still runs and
    # reports, but does not fail the workflow.
    continue-on-error: ${{ matrix.ios_major == '26' }}
    strategy:
      fail-fast: false
      matrix:
        ios_major: ["18", "26"]
    env:
      BUNDLE_ID: com.example.openpilotphone
      IOS_MAJOR: ${{ matrix.ios_major }}
    steps:
      - uses: actions/checkout@v4

      - name: Check inputs
        run: |
          ls -la core fixtures coreml
          test -f core/opcore.h
          test -f core/opcore.c
          test -f fixtures/frames_u8.bin
          test -f fixtures/outputs_f32.bin

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd ios
          xcodegen generate

      - name: Tool versions and simulators
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devices available

      - name: Pick simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 scripts/pick_simulator.py)
          echo "Using simulator $UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build
        run: |
          mkdir -p artifacts
          xcodebuild \
            -project ios/OpenpilotPhone.xcodeproj \
            -scheme OpenpilotPhone \
            -configuration Release \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            build 2>&1 | tee artifacts/xcodebuild.log

      - name: Boot simulator and install app
        run: |
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find build/Build/Products -maxdepth 2 -name 'OpenpilotPhone.app' | head -n 1)
          echo "App: $APP"
          xcrun simctl install "$UDID" "$APP"

      - name: Launch with -selftest
        run: |
          : > artifacts/console.log
          xcrun simctl launch --console "$UDID" "$BUNDLE_ID" -selftest > artifacts/console.log 2>&1 &
          LAUNCH_PID=$!
          for i in $(seq 1 180); do
            if grep -qE "SELFTEST (PASS|FAIL)" artifacts/console.log; then break; fi
            sleep 5
          done
          sleep 3
          xcrun simctl io "$UDID" screenshot artifacts/screenshot.png || true
          CONTAINER=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data || true)
          echo "Container: $CONTAINER"
          cp "$CONTAINER/Documents/selftest.txt" artifacts/selftest.txt || echo "no selftest.txt found"
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          kill "$LAUNCH_PID" 2>/dev/null || true
          echo "----- console.log -----"
          cat artifacts/console.log

      # Second launch without -selftest: the simulator loops fixture frames through the full live path
      # (model with state, C output parsing, plot). The app logs a LIVE line every 20 frames.
      - name: Launch live mode
        run: |
          : > artifacts/console_live.log
          xcrun simctl launch --console "$UDID" "$BUNDLE_ID" > artifacts/console_live.log 2>&1 &
          LIVE_PID=$!
          for i in $(seq 1 36); do
            if [ "$(grep -c "LIVE frames" artifacts/console_live.log)" -ge 3 ]; then break; fi
            sleep 5
          done
          sleep 2
          xcrun simctl io "$UDID" screenshot artifacts/screenshot_live.png || true
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          kill "$LIVE_PID" 2>/dev/null || true
          echo "----- console_live.log -----"
          cat artifacts/console_live.log

      # Experiment, never gates the job: drive the Neural Engine through private classes (see experiments/ane_probe).
      # The simulator has no Neural Engine, so this mostly records what the classes report there.
      - name: Launch with -aneprobe
        continue-on-error: true
        run: |
          set +e
          : > artifacts/console_aneprobe.log
          xcrun simctl launch --console "$UDID" "$BUNDLE_ID" -aneprobe > artifacts/console_aneprobe.log 2>&1 &
          PROBE_PID=$!
          for i in $(seq 1 36); do
            if grep -q "ANEPROBE DONE" artifacts/console_aneprobe.log; then break; fi
            sleep 5
          done
          sleep 2
          CONTAINER=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data || true)
          cp "$CONTAINER/Documents/aneprobe.txt" artifacts/aneprobe.txt || echo "no aneprobe.txt found"
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          kill "$PROBE_PID" 2>/dev/null || true
          echo "----- console_aneprobe.log -----"
          cat artifacts/console_aneprobe.log
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-sim-logs-ios${{ matrix.ios_major }}
          path: artifacts/

      - name: Require SELFTEST PASS
        run: |
          grep -q "LIVE frames" artifacts/console_live.log
          grep -q "SELFTEST PASS" artifacts/console.log
